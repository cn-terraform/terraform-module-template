name: Terraform
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
  release:
    types: [published]

jobs:
  check-format:
    runs-on: ubuntu-latest
    container: hashicorp/terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

  discover-examples:
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set validation matrix
        id: set-matrix
        run: |
          # Find all subdirectories in examples folder and convert to JSON array
          DIRS=$(find examples -maxdepth 1 -mindepth 1 -type d | sort)
          MATRIX=$(echo "$DIRS" | jq -R . | jq -s . | tr -d '\n')
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT

  validations:
    needs: discover-examples
    runs-on: ubuntu-latest
    container: hashicorp/terraform
    strategy:
      matrix:
        dir: ${{ fromJson(needs.discover-examples.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Terraform Init
        run: terraform init -upgrade
        working-directory: ${{ matrix.dir }}
      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ matrix.dir }}
      - name: Terraform Test (Mocked AWS)
        run: |
          if grep -Eq "aws\.(main|acm_provider)" main.tf; then
            cat > ci-mock.tftest.hcl <<EOF
          mock_provider "aws" {
            alias = "ci_main"
            override_during = plan
          }
          mock_provider "aws" {
            alias = "ci_acm"
            override_during = plan
          }
          run "example_plan" {
            command = plan
            providers = {
              aws.main = aws.ci_main
              aws.acm_provider = aws.ci_acm
            }
          }
          EOF
          else
            cat > ci-mock.tftest.hcl <<EOF
          mock_provider "aws" {
            alias = "ci"
            override_during = plan
          }
          run "example_plan" {
            command = plan
            providers = {
              aws = aws.ci
            }
          }
          EOF
          fi
          terraform test -filter=ci-mock.tftest.hcl
        working-directory: ${{ matrix.dir }}
